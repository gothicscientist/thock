name: Check repository documentation
on:
  pull_request:
    paths: ['README.md', 'CHANGELOG.md', 'docs/**', 'scripts/check-docs.mjs', 'package.json', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['README.md', 'CHANGELOG.md', 'docs/**', 'scripts/check-docs.mjs', 'package.json', '.github/workflows/docs.yml']
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run docs:check
